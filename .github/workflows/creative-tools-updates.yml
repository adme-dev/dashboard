name: Check creative tools upstream releases

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate read-only checker
        run: python3 -m unittest discover -s workers/creative-suite-upgrade -p test_check_updates.py -v
      - name: Compare upstream inputs and published six-editor receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 workers/creative-suite-upgrade/check-updates.py --report "$RUNNER_TEMP/creative-updates/report.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: creative-upstream-releases-${{ github.run_id }}
          path: ${{ runner.temp }}/creative-updates/
          retention-days: 30
          if-no-files-found: warn
