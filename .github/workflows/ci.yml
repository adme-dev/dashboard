name: ci

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Run containing the verified frozen artifact and approval
        required: true
        type: string
      frozen_artifact_name:
        description: Immutable artifact bundle name
        required: true
        type: string
      approval_artifact_name:
        description: Signed production_deploy approval artifact name
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24.18.0]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs first: broadest signal, and `deploy` gates on this job. Until this
      # step existed CI ran ~750 of ~8200 tests, so a regression anywhere else
      # reached production behind a green check — main deploys on merge.
      - name: Full test suite
        run: pnpm run test:run
        timeout-minutes: 20

      # Kept as separate steps despite being subsets of the run above: both are
      # named safety gates, and a distinct red step names the blast radius
      # faster than one failure buried in the full run.
      - name: Social publishing regression tests
        run: pnpm run test:social-publishing
        timeout-minutes: 15

      - name: Pages deployment target guard
        run: pnpm run test:deployment-guards

  deploy:
    needs: ci
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production_deploy
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download frozen release artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.frozen_artifact_name }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/crm-search-frozen

      - name: Download signed production approval
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.approval_artifact_name }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/crm-search-approval

      - name: Verify Pages deployment target
        run: pnpm run deploy:check

      - name: Deploy verified frozen bytes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRM_SEARCH_FROZEN_ARTIFACT_MANIFEST: ${{ runner.temp }}/crm-search-frozen/artifact-manifest.json
          CRM_SEARCH_FROZEN_PAGES_DIRECTORY: ${{ runner.temp }}/crm-search-frozen/pages
          CRM_SEARCH_FROZEN_BINDING_MANIFEST: ${{ runner.temp }}/crm-search-frozen/binding-manifest.json
          CRM_SEARCH_DEPLOYMENT_APPROVAL: ${{ runner.temp }}/crm-search-approval/production-deploy-approval.json
          CRM_SEARCH_RELEASE_APPROVAL_VERIFICATION_KEYRING: ${{ secrets.CRM_SEARCH_RELEASE_APPROVAL_VERIFICATION_KEYRING }}
        run: pnpm deploy:production

      - name: Smoke production origin
        run: curl --fail --retry 5 --retry-delay 5 --silent --show-error --head https://agency-dashboard-6cm.pages.dev/

      - name: Smoke agency workflows readiness
        env:
          AGENCY_WORKFLOWS_CI_REQUIRE_SMOKE_AUTH: 'true'
          AGENCY_WORKFLOWS_SMOKE_SHARED_SECRET: ${{ secrets.AGENCY_WORKFLOWS_SMOKE_SHARED_SECRET }}
          AGENCY_WORKFLOWS_SMOKE_AUTH_TOKEN: ${{ secrets.AGENCY_WORKFLOWS_SMOKE_AUTH_TOKEN }}
          AGENCY_WORKFLOWS_SMOKE_COOKIE: ${{ secrets.AGENCY_WORKFLOWS_SMOKE_COOKIE }}
        run: pnpm run smoke:agency-workflows:ci
