name = "pages-cron"
main = "src/index.ts"
compatibility_date = "2025-12-01"

# Drives the Pages app's HTTP /api/cron/* routes (Pages has no scheduled()
# handler). Each expression fans out to one or more endpoints — see ROUTES in
# src/index.ts. meta-ad-status-sync lives in its own worker (meta-status-cron).
[triggers]
crons = [
  "0 * * * *",    # anomaly-detection + ga4-sync
  "30 * * * *",   # ga4-dimensions
  "*/5 * * * *",  # office-assistant
  "45 * * * *",   # xero-customer-sync (hourly delta cache refresh; was */15 — quota burner)
  "15 2 * * *",    # Search Console evidence + indexed-version URL inspection
  "40 2 * * *",    # optional Google Business Profile performance evidence
  "20 3 * * *",   # xero-invoice-lines-sync (AGI cache refresh)
  "35 3 * * *",   # office-retention
  "45 3 * * *",   # tracking-retention
  "55 3 * * *",   # persona-tier-recompute (hot/warm/cold audience tiers + negative-signal exclusion audience)
  "10 4 * * *",   # feed-post-rules (flag-gated, review-only drafts)
  "0 20 * * *",     # sync-spend (Meta/Google/etc. ad-spend, non-blocking)
  "15 20 * * *",    # Google Ads call_view status + duration reporting
  "30 20 * * *",    # read-only Google AI Max readiness scan
  "45 21 * * *",    # pre-morning ad-spend refresh (07:45 Melbourne)
  "15 22 * * *",    # sync-ad-creatives (creative text into campaign_creatives, 08:15 Melbourne)
  "15 23 * * *",  # alert if the pre-morning sync has not moved data within 90 minutes
  "15 */2 * * *"   # dealer inventory scrape refresh on socials.driveagent.io (EXTERNAL_ROUTES)
]

# Workers Logs so a cron slot that did not fire is distinguishable from one that fired and got a
# 401/500 — without this the 2026-08-20 "did sync-spend run?" question was unanswerable.
[observability]
enabled = true

[vars]
APP_BASE_URL = "https://agency-dashboard-6cm.pages.dev"

# CRON_SECRET is a secret (must match the Pages project's CRON_SECRET):
#   wrangler secret put CRON_SECRET --name pages-cron   (run from a non-Pages cwd)
