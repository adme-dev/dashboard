name = "office-room-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "OFFICE_ROOMS"
class_name = "OfficeRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OfficeRoom"]

[vars]
# Base URL of the Pages app — DO posts here to mirror office status to the
# chat presence tables. Override per-environment if needed.
SYNC_BASE_URL = "https://agency-dashboard-6cm.pages.dev"

# OFFICE_SYNC_SECRET is set as a worker secret, not committed:
#   cd workers/office-room && wrangler secret put OFFICE_SYNC_SECRET
# The same value must also exist as an env var on the Pages app so the
# /api/office/_internal/sync-status endpoint can verify the header.

# Phase 1b — Cloudflare RealtimeKit secrets. All three must be set before
# any zone:enter will succeed; otherwise the DO replies zone:join-failed
# reason='realtime-unavailable'.
#   cd workers/office-room && wrangler secret put CF_ACCOUNT_ID
#   cd workers/office-room && wrangler secret put CF_REALTIMEKIT_APP_ID
#   cd workers/office-room && wrangler secret put CF_REALTIMEKIT_API_TOKEN
# CF_REALTIMEKIT_API_TOKEN is a CF account-level API token with the
# 'Realtime Kit:Edit' scope (Account > Realtime Kit > Edit). The DO uses
# it to call api.cloudflare.com/.../realtime/kit/<app>/meetings/* for
# meeting creation, participant token minting, and refresh.
