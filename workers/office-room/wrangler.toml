name = "office-room-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "OFFICE_ROOMS"
class_name = "OfficeRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OfficeRoom"]

[vars]
# Base URL of the Pages app — DO posts here to mirror office status to the
# chat presence tables. Override per-environment if needed.
SYNC_BASE_URL = "https://agency-dashboard-6cm.pages.dev"

# OFFICE_SYNC_SECRET is set as a worker secret, not committed:
#   cd workers/office-room && wrangler secret put OFFICE_SYNC_SECRET
# The same value must also exist as an env var on the Pages app so the
# /api/office/_internal/sync-status endpoint can verify the header.

# REALTIME_APP_ID and REALTIME_APP_SECRET are set as worker secrets, not committed:
#   cd workers/office-room && wrangler secret put REALTIME_APP_ID
#   cd workers/office-room && wrangler secret put REALTIME_APP_SECRET
# When absent, room entry still works and the client stays in local-preview mode.

# Dealer guest media is fail-closed and requires both settings. Keep the
# global switch false/absent until a named pilot Office is ready:
#   OFFICE_GUEST_REALTIME_MEDIA_ENABLED=false
#   OFFICE_GUEST_REALTIME_PILOT_OFFICE_IDS=<comma-separated Office UUIDs>
# Set both on this Worker and the agency-dashboard Pages environment.
