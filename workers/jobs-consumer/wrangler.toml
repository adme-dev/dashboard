name = "jobs-consumer"
main = "src/index.ts"
compatibility_date = "2025-12-01"

# Consumes the `agency-jobs` queue (the Pages app's JOBS_QUEUE producer binding).
#
# Why a standalone Worker: Cloudflare Pages projects can't declare
# [[queues.consumers]], and the Nitro `cloudflare:queue` hook
# (server/plugins/queue.ts) never fires on the deployed Pages worker. So every
# message produced to `agency-jobs` (spend.sync.meta.account, board.notify,
# eom.generate, embed.*) sat unconsumed — which left the daily ad-spend sync
# stuck "running" with 0 accounts processed.
#
# This Worker is a thin bridge: it POSTs each message to the Pages app's
# /api/internal/process-job route, which runs processJob() inside a real request
# context (fast pooled DB + reachable bindings). Same pattern as workers/pages-cron.
# Mirrors leads-delivery-worker / audio-jobs (both standalone queue consumers).

[[queues.consumers]]
queue = "agency-jobs"
# Each message is one unit of work (e.g. one Meta ad account). THROTTLED on
# purpose: the daily Meta spend sync fans out ~113 per-account messages, and
# processing them in a concurrent burst makes Meta's Graph API return empty
# insights (rate-limited) — the sync then silently writes $0. A near-sequential
# run is what Meta tolerates (proven: a fully sequential run synced all 113
# cleanly, ~$30k). max_batch_size=1 + max_concurrency=2 keeps at most 2 accounts
# in flight at once. If $0 syncs ever recur, drop max_concurrency to 1.
max_batch_size = 1
max_concurrency = 2
max_batch_timeout = 5
max_retries = 3
retry_delay = 15
dead_letter_queue = "agency-jobs-dlq"

[vars]
APP_BASE_URL = "https://agency-dashboard-6cm.pages.dev"

# CRON_SECRET is a secret (must match the Pages project's CRON_SECRET):
#   wrangler secret put CRON_SECRET --name jobs-consumer   (run from a non-Pages cwd)
