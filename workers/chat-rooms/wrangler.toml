name = "chat-rooms-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "CHAT_ROOMS", class_name = "ChatRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[queues.producers]]
binding = "CHAT_QUEUE"
queue = "chat-notifications"

[vars]
API_URL = "https://agency-dashboard-6cm.pages.dev"

# INTERNAL_API_KEY should be set as a secret:
# wrangler secret put INTERNAL_API_KEY
