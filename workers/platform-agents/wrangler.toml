name = "platform-agents"
main = "src/index.ts"
compatibility_date = "2026-06-26"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Think runtime for durable platform agents. The first production
# agent is SpendControllerAgent; proposal drafting and execution remain gated in
# the Pages app.

[ai]
binding = "AI"

[vars]
APP_BASE_URL = "https://app.xeroflow.io"
THINK_MODEL = "@cf/moonshotai/kimi-k2.7-code"
# Coordinated with PLATFORM_AGENT_THINK_TURNS_ENABLED in the Pages app.
# Leave false until secrets, Access policy, evaluation, and rollout approval are complete.
THINK_TURNS_ENABLED = "false"

[durable_objects]
bindings = [
  { name = "SpendControllerAgent", class_name = "SpendControllerAgent" },
  { name = "PublishingPlannerAgent", class_name = "PublishingPlannerAgent" },
  { name = "FinancialWatchAgent", class_name = "FinancialWatchAgent" },
  { name = "TrafficControllerAgent", class_name = "TrafficControllerAgent" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpendControllerAgent"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PublishingPlannerAgent"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["FinancialWatchAgent"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["TrafficControllerAgent"]

# Secrets:
#   INTERNAL_API_KEY - must match the Pages app secret for Worker -> app calls.
#   PLATFORM_AGENT_SCOPE_SIGNING_SECRET - separate 32+ character HMAC secret;
#     must match Pages and must never be reused as INTERNAL_API_KEY.
