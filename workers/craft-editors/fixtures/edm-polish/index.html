<!doctype html>
<meta charset="utf-8">
<title>Isolated EDM native acceptance fixture</title>
<style>body{margin:0;font:14px system-ui;background:#eee;color:#171717}header{padding:8px;display:flex;gap:12px;align-items:center}button{padding:8px}iframe{display:block;border:0;width:100%;height:calc(100vh - 56px)}pre{position:fixed;bottom:0;max-height:30vh;overflow:auto;background:white;max-width:100%}</style>
<header><strong>Local native fixture — no server saves</strong><button id="content">Import content</button><button id="designer">Import designer</button><button id="snapshot">Snapshot</button><output id="status">Loading native WASM</output></header>
<iframe title="Native EDM candidate" src="/native/index.html"></iframe><pre id="result" hidden></pre>
<script type="module">
const frame=document.querySelector('iframe'), status=document.querySelector('#status');
const design=await fetch('/design.json').then(r=>r.json());
const capabilities=await fetch('/capabilities.json').then(r=>r.json());
let mode='content', sequence=0;
const receipts=[];
async function raw(action,params={},binding={}) {
  const request={requestId:`polish-fixture-${++sequence}`,action,params,...binding};
  const encoded=await frame.contentWindow.__xfFigBridge.request(JSON.stringify(request));
  const reply=typeof encoded==='string'?JSON.parse(encoded):encoded;
  receipts.push({request,reply});
  if(!reply.ok)throw Error(JSON.stringify(reply));
  return reply;
}
async function call(action,params={}) {
  const s=await raw('status');
  return raw(action,params,{instanceId:s.instanceId,documentId:s.documentId,expectedRevision:s.revision});
}
async function load(selected) {
  mode=selected;
  const params={design,images:{}};
  if(mode==='designer')Object.assign(params,{operationId:'123e4567-e89b-42d3-a456-426614174000',capabilities});
  await call(mode==='designer'?'edm_designer_import':'edm_import',params);
  status.textContent=`Imported ${mode} fixture`;
}
async function snapshot() {
  const result=(await call(mode==='designer'?'edm_designer_snapshot':'edm_snapshot')).result;
  const pre=document.querySelector('#result');pre.hidden=false;pre.textContent=JSON.stringify(result,null,2);
  return result;
}
for(const selected of ['content','designer'])document.querySelector('#'+selected).onclick=()=>load(selected).catch(e=>status.textContent=e.message);
document.querySelector('#snapshot').onclick=()=>snapshot().catch(e=>status.textContent=e.message);
const start=Date.now();
while(!frame.contentWindow.__xfFigBridge){if(Date.now()-start>60000)throw Error('Native bridge unavailable');await new Promise(r=>setTimeout(r,100));}
status.textContent='Native bridge ready';
window.__edmPolishFixture={load,snapshot,call,receipts,design,capabilities};
</script>
