# workers/audio-jobs/wrangler.toml
# Audio Studio Phase 2/3 — music generation queue consumer + FFmpeg render container.
#
# Why a standalone Worker (not the Pages app): the deployed Pages worker entry
# (scripts/wrap-worker.mjs) exports only fetch + scheduled, so a Pages-side queue
# consumer never fires, and AI/R2 bindings aren't reachable outside a request.
# This Worker has AI + R2 + DB as first-class bindings. Mirrors leads-delivery-worker.
name = "audio-jobs"
main = "src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

# Workers AI — used for the MiniMax music model (partner model via AI Gateway).
[ai]
binding = "AI"

# Same R2 bucket the Pages app presigns from (server/utils/storage.ts →
# R2_BUCKET_NAME, default 'agency-files'). The Worker .put()s the master here;
# Pages reads audio_assets.r2_key_master and presigns it. One object store.
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "agency-files"

# Shares the Hyperdrive pooler (→ same Neon DB) as leads-delivery-worker.
# pg over raw TCP isn't possible in a Worker without Hyperdrive.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "900b4b74ec41462cbbabebd0aa8775aa"

# Queue consumer — the Pages app produces to `music-gen`, this Worker consumes.
# Standalone Workers MAY declare consumers in wrangler.toml (unlike Pages).
# batch size 1: each generation is a long-running AI call — process one at a time.
[[queues.consumers]]
queue = "music-gen"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "music-gen-dlq"

# Media Studio SP1 — timeline render queue. The Pages app produces to
# `timeline-render` (TIMELINE_RENDER_QUEUE binding); this Worker consumes and
# branches on batch.queue in index.ts. batch size 1: a multi-clip ffmpeg mixdown
# + per-channel loudnorm is heavy — one job per invocation.
[[queues.consumers]]
queue = "timeline-render"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "timeline-render-dlq"

# Phase 3 — FFmpeg render service as a CF Container bound to this Worker
# (RENDER). The queue handler invokes it per channel to produce loudness-
# normalised variants. Stateless; the Worker owns R2/DB.
[[containers]]
name = "audio-render"
class_name = "RenderContainer"
image = "./container/Dockerfile"
max_instances = 3
# ffmpeg 2-pass loudnorm needs real memory — don't run on the smallest instance.
# "standard" was renamed to "standard-1" (wrangler 4.95+).
instance_type = "standard-1"

[[durable_objects.bindings]]
class_name = "RenderContainer"
name = "RENDER"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RenderContainer"]
