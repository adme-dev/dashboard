name = "agency-dashboard"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]

# ============================================
# Cloudflare Bindings
# ============================================

# KV — edge caching for tokens, sessions, and report responses
# Create with: npx wrangler kv namespace create CACHE
# Then paste the ID below
[[kv_namespaces]]
binding = "CACHE"
id = "7d5db1c489cb40f4b809d611e1408acd"

# Queues — reliable background job processing with retry and dead-letter
# Create with: npx wrangler queues create agency-jobs
# NOTE: consumers must be configured on a separate Worker, not on Pages.
# Consumer: workers/jobs-consumer (bridges each message → /api/internal/process-job).
[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "agency-jobs"

# Producer binding for the leads delivery queue. Consumer runs in
# workers/leads-delivery-worker/ — registered via [[queues.consumers]] in that
# worker's wrangler.toml, which uses [alias] to redirect Nitro-style imports
# to worker-local pg-based adapters.
[[queues.producers]]
binding = "LEADS_DELIVERY_QUEUE"
queue = "leads-delivery-queue"

# Minimal conversion identity messages only. The standalone measurement delivery
# Worker consumes this queue; canonical event and destination data stay in Neon.
[[queues.producers]]
binding = "MEASUREMENT_DELIVERY_QUEUE"
queue = "measurement-delivery"

# Producer binding for the Audio Studio music-generation queue. Consumer runs in
# workers/audio-jobs/ (the Pages worker entry exports only fetch+scheduled, so a
# Pages-side queue consumer never fires — it must live in a standalone Worker).
# Without this binding generate.post.ts returns 503 ("not enabled yet").
[[queues.producers]]
binding = "MUSIC_QUEUE"
queue = "music-gen"

# Producer binding for Media Studio timeline renders. Consumer runs in
# workers/audio-jobs/ as the `timeline-render` queue branch.
[[queues.producers]]
binding = "TIMELINE_RENDER_QUEUE"
queue = "timeline-render"

# Producer binding for Video Studio composite renders. Consumer runs in
# workers/audio-jobs/ as the `video-render` queue branch.
[[queues.producers]]
binding = "VIDEO_RENDER_QUEUE"
queue = "video-render"

# Producer binding for Banner Studio MP4 renders (#2a). Consumer runs in
# workers/audio-jobs/ as the `banner-render` queue branch.
# ACTIVATED 2026-06-22 (sign-off): banner-render + banner-render-dlq queues created;
# audio-jobs Worker + Chromium container (bannerCapture.mjs) deployed with the
# banner-render consumer attached. In-app MP4 export + MCP banner-confirm enqueue here.
[[queues.producers]]
binding = "BANNER_RENDER_QUEUE"
queue = "banner-render"

# Producer binding for AI Video Studio generation jobs. Consumer runs in
# workers/video-generation/ as the `video-generation` queue branch.
[[queues.producers]]
binding = "VIDEO_GENERATION_QUEUE"
queue = "video-generation"

# Producer binding for Video Studio asset intelligence jobs. The dedicated
# workers/asset-intelligence/ Worker consumes the `asset-intelligence` queue.
[[queues.producers]]
binding = "ASSET_INTELLIGENCE_QUEUE"
queue = "asset-intelligence"

# R2 — native object storage binding for server-side uploads. The S3-SDK-over-fetch
# path silently drops PutObject bodies in the Pages/workerd runtime (200 but no object
# written — UNSIGNED-PAYLOAD means R2 won't reject a missing body), so storage.ts
# prefers this binding and falls back to the S3 SDK only outside Cloudflare.
# ⚠️ Verify it reaches the deployed Pages runtime via dashboard → Settings → Bindings;
# binding propagation from wrangler.toml has been inconsistent (VIDEO_RENDER_QUEUE).
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "agency-files"

# AI — Workers AI for embeddings and edge inference
[ai]
binding = "AI"

# Vectorize — semantic search index for tasks, briefs, clients, knowledge
# Create with: npx wrangler vectorize create agency-search --dimensions=768 --metric=cosine
[[vectorize]]
binding = "VECTORIZE"
index_name = "agency-search"

# Browser Rendering — headless Chromium for banner image export (PNG/JPG)
# Enable in Cloudflare dashboard: Workers & Pages > Browser Rendering
[browser]
binding = "BROWSER"

# Hyperdrive — edge TCP connection pooling for Neon Postgres (~9x faster queries)
# db.ts uses pg.Client (TCP) with this binding; falls back to neon() HTTP in local dev.
# Config points to direct Neon host (not -pooler) — Hyperdrive handles pooling.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "900b4b74ec41462cbbabebd0aa8775aa"

# Service binding — Pages-to-Worker bridge for Cloudflare Workflows.
# The standalone Worker keeps Workflow control logic out of Pages; Pages starts
# instances through this binding and cron remains the fallback until cutover.
[[services]]
binding = "AGENCY_WORKFLOWS"
service = "agency-workflows"

# ============================================
# Environment Variables (non-secret)
# ============================================
[vars]
APP_NAME = "XeroFlow Agency"
NODE_VERSION = "24"
META_LOGIN_CONFIG_ID = "1740422843746070"
EMAIL_FROM = "notification@adme.net.au"
# Private internal Send v1. SEND_ENABLED is the product flag consumed at build
# time; the NUXT_* aliases keep both server and client runtime config enabled on
# Cloudflare Pages. Disable all three together for the release kill switch.
SEND_ENABLED = "true"
NUXT_SEND_ENABLED = "true"
NUXT_PUBLIC_SEND_ENABLED = "true"
# Verified-public Send remains independently fail-closed while activation gates run.
SEND_PUBLIC_ENABLED = "false"
NUXT_PUBLIC_SEND_PUBLIC_ENABLED = "false"
SEND_PUBLIC_MAX_TRANSFER_BYTES = "262144000"
SEND_PUBLIC_MAX_FILE_BYTES = "104857600"
SEND_PUBLIC_MAX_FILES = "10"
SEND_PUBLIC_DEFAULT_RETENTION_DAYS = "3"
SEND_PUBLIC_MAX_RETENTION_DAYS = "3"
SEND_PUBLIC_MAX_DOWNLOADS = "20"
SEND_PUBLIC_TURNSTILE_HOSTNAME = "app.xeroflow.io"
# Cloudflare AI Gateway root for server-side Groq SDK calls. The app normalizes
# Groq requests to /groq and falls back to direct Groq if Gateway auth rejects.
AI_GATEWAY_URL = "https://gateway.ai.cloudflare.com/v1/a5b299b3ad15c1b5b895dc66f9357b17/default"
# AI Model Ops orchestrator readiness:
# - INTERNAL_API_KEY is a secret, set in Cloudflare Pages dashboard or via wrangler secret.
# - AI_ORCHESTRATOR_WORKER_URL is optional until the standalone Worker is deployed.
#   Uncomment after deploying workers/ai-orchestrator-agent so Model Ops can show Worker readiness.
# AI_ORCHESTRATOR_WORKER_URL = "https://ai-orchestrator-agent.<subdomain>.workers.dev"
# APP_URL is set in CF Pages dashboard to avoid binding conflict
# Cloudflare Workflows control plane. Secrets are managed in Cloudflare:
# WORKFLOW_SERVICE_SECRET and WORKFLOW_CALLBACK_SECRET.
AGENCY_WORKFLOWS_ENABLED = "true"
# High-entropy smoke secret verifier for CI diagnostics. GitHub Actions stores
# the raw AGENCY_WORKFLOWS_SMOKE_SHARED_SECRET; Pages only needs this hash.
AGENCY_WORKFLOWS_SMOKE_SHARED_SECRET_SHA256 = "8aa2f98fd3d621bb0ac8f0157622d86cae347e14cdb35f32375b9467778462f2"
# Workflow-primary scheduled publishing cutover. Keep false until
# `pnpm run smoke:agency-workflows` passes against production with admin auth.
AGENCY_WORKFLOWS_SCHEDULED_PUBLISHING_PRIMARY = "false"
# CRM follow-up Workflow cutover remains doubly dormant:
# - WRITES enables the Workflow callback to create notifications and stamp crm_tasks.reminded_at.
# - PRIMARY makes the legacy crm-task-reminders cron delegate to the Workflow instead of writing directly.
AGENCY_WORKFLOWS_CRM_FOLLOWUP_WRITES_ENABLED = "false"
AGENCY_WORKFLOWS_CRM_FOLLOWUP_PRIMARY = "false"
# MCP server (Phase 1) — non-secret plaintext vars MUST live here, not the CF dashboard:
# deployConfig bakes [vars] into the Direct-Upload deploy config, which REPLACES dashboard
# plaintext vars (secrets survive). MCP_INTERNAL_SECRET + MCP_HANDSHAKE_SECRET stay as dashboard secrets.
MCP_SERVER_ENABLED = "true"
MCP_WORKER_ORIGIN = "https://mcp-server.adme-dev.workers.dev"
# MCP Phase 2a — owned generation tools (generate_voiceover, start_music_generation,
# get_generation_status). ACTIVATED 2026-06-21 (operator sign-off): CREATIVE-gated, audited,
# no platform-state writes. Per-actor rate limit is a fast-follow.
MCP_GEN_TOOLS_ENABLED = "true"
# MCP Phase 2c — confirm-tier WRITE tools (propose_*/confirm_action) over MCP. DORMANT: left UNSET
# (absent = off). Non-financial writes only (financial held for D4). To activate after sign-off,
# uncomment + redeploy (each propose persists a HITL pending row; confirm executes via the existing
# executor registry; rich_confirm needs ack):
# MCP_WRITE_TOOLS_ENABLED = "true"
# MCP Phase 2b — video-generation suite over MCP. DORMANT: left UNSET (absent = off).
#   MCP_VIDEO_TOOLS_ENABLED  → discovery reads + status (list_av_projects/list_video_models/
#                              list_video_generations/get_video_generation_status; no spend, no writes)
#   MCP_VIDEO_GEN_ENABLED    → confirm-tier propose_video_generation + create_video_project (bills;
#                              HITL propose→confirm; video spend is NOT in the D4 financial set)
# Doubly-dormant: live-verify ALSO needs base VIDEO_GENERATION_ENABLED baked into these [vars]
# (currently absent → engine 404s). Activate after sign-off: uncomment + redeploy from clean worktree.
# PHASE 1 GO-LIVE (2026-06-22): reads ON (browse-only, zero spend path). Phase 2 (generation) stays
# OFF until a tenant + cap is chosen — leave MCP_VIDEO_GEN_ENABLED + VIDEO_GENERATION_ENABLED commented.
MCP_VIDEO_TOOLS_ENABLED = "true"
# MCP_VIDEO_GEN_ENABLED = "true"
# VIDEO_GENERATION_ENABLED = "true"
# MCP Phase 2b — banner-render suite over MCP. ACTIVATED 2026-06-22 (sign-off).
# MCP_BANNER_TOOLS_ENABLED → banner read tools (list_banner_projects/get_banner_render_status) +
#   propose_banner_render confirm-tier (HITL propose→confirm_action→dispatch). CREATIVE-gated.
MCP_BANNER_TOOLS_ENABLED = "true"
# MCP Phase D4 — financial write tools over MCP. DORMANT: set to "false" until sign-off.
# MCP_FINANCIAL_TOOLS_ENABLED → propose_budget_change, propose_eom_generate, propose_expense_approval
#   (money-movers; require ack:true at confirm), propose_quote, propose_expense_classify,
#   propose_budget_alert — all gated independently from MCP_WRITE_TOOLS_ENABLED.
MCP_FINANCIAL_TOOLS_ENABLED = "false"
# MCP CRITICAL-B — OAuth write-scope enforcement. When "true", any WRITE-class tool over MCP
# (propose_*/confirm_action/generation/banner/financial) requires the connector to hold the mcp:write
# scope (granted via the "Allow read + write" consent button); read-only-consented connectors are limited
# to reads. DORMANT ("false") so existing read-only connectors keep working. ⚠️ BREAKING when flipped on:
# existing connectors must RECONNECT and grant write to regain write/generation. Activation order (after
# this whole branch deploys): operators reconnect granting write → set "true" → verify a financial
# propose→confirm works from a Claude host → only THEN set MCP_FINANCIAL_TOOLS_ENABLED="true".
# Flipping MCP_FINANCIAL_TOOLS_ENABLED without this on would expose money-movers under a read-only consent.
MCP_REQUIRE_WRITE_SCOPE = "false"

# Chat — Durable Objects (hosted in separate worker)
[[durable_objects.bindings]]
