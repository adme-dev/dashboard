# ============================================
# Scheduled Triggers
# ============================================
#
# Cloudflare Pages does NOT support [triggers] in wrangler.toml — wrangler v4
# rejects it with: 'Configuration file for Pages projects does not support "triggers"'.
# Pages cron triggers are configured via the dashboard only.
#
# To enable the anomaly-detection cron after deploy:
#   Workers & Pages → agency-dashboard → Settings → Triggers → Cron
#   Schedule: 0 * * * *  (top of every hour; the handler self-gates to 7am tenant-local)
#   Target:   POST /api/cron/anomaly-detection
#   Header:   x-cron-secret: <CRON_SECRET>  (auth — must match env var)
#
# To enable office assistant watch evaluation:
#   Workers & Pages → agency-dashboard → Settings → Triggers → Cron
#   Schedule: */5 * * * *  (assistant watches have their own 15-minute debounce)
#   Target:   POST /api/cron/office-assistant
#   Header:   x-cron-secret: <CRON_SECRET>  (auth — must match env var)
#
# To enable office meeting/recording retention cleanup:
#   Workers & Pages → agency-dashboard → Settings → Triggers → Cron
#   Schedule: 35 3 * * *  (daily)
#   Target:   POST /api/cron/office-retention
#   Header:   x-cron-secret: <CRON_SECRET>  (auth — must match env var)
#
# To enable GA4 channel-metrics sync:
#   Workers & Pages → agency-dashboard → Settings → Triggers → Cron
#   Schedule: 0 * * * *  (hourly; idempotent, always re-pulls the trailing ~48h)
#   Target:   POST /api/cron/ga4-sync
#   Header:   x-cron-secret: <CRON_SECRET>  (auth — must match env var)
#
# To enable GA4 richer dimensions/events (separate invocation budget; processes
# the stalest ~25 properties/run, converges over successive runs):
#   Workers & Pages → agency-dashboard → Settings → Triggers → Cron
#   Schedule: 30 * * * *  (hourly, offset from the channel sync)
#   Target:   POST /api/cron/ga4-dimensions
#   Header:   x-cron-secret: <CRON_SECRET>  (auth — must match env var)
#
# To enable scheduled white-label client reports:
#   Workers & Pages → agency-dashboard → Settings → Triggers → Cron
#   Schedule: 0 6 * * *  (daily; each schedule self-gates on its weekly/monthly cadence)
#   Target:   POST /api/cron/scheduled-reports
#   Header:   x-cron-secret: <CRON_SECRET>  (auth — must match env var)
