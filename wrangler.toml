name = "agency-dashboard"
pages_build_output_dir = "dist"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]

# ============================================
# Cloudflare Bindings
# ============================================

# KV — edge caching for tokens, sessions, and report responses
# Create with: npx wrangler kv namespace create CACHE
# Then paste the ID below
[[kv_namespaces]]
binding = "CACHE"
id = "7d5db1c489cb40f4b809d611e1408acd"

# Queues — reliable background job processing with retry and dead-letter
# Create with: npx wrangler queues create agency-jobs
# NOTE: consumers must be configured on a separate Worker, not on Pages
[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "agency-jobs"

# AI — Workers AI for embeddings and edge inference
[ai]
binding = "AI"

# Vectorize — semantic search index for tasks, briefs, clients, knowledge
# Create with: npx wrangler vectorize create agency-search --dimensions=768 --metric=cosine
[[vectorize]]
binding = "VECTORIZE"
index_name = "agency-search"

# Browser Rendering — headless Chromium for banner image export (PNG/JPG)
# Enable in Cloudflare dashboard: Workers & Pages > Browser Rendering
[browser]
binding = "BROWSER"

# Hyperdrive — edge connection pooling for Neon Postgres
# DISABLED: neon() HTTP driver is incompatible with Hyperdrive (it rewrites hostname
# to a TCP proxy, but neon() makes HTTP requests to the hostname). Hyperdrive only
# works with Pool/Client (Postgres wire protocol). To re-enable, db.ts needs split
# connection strings: DATABASE_URL for neon(), HYPERDRIVE for Pool/transaction().
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "900b4b74ec41462cbbabebd0aa8775aa"

# ============================================
# Environment Variables (non-secret)
# ============================================
[vars]
APP_NAME = "XeroFlow Agency"
NODE_VERSION = "22"
EMAIL_FROM = "notification@adme.net.au"
# APP_URL is set in CF Pages dashboard to avoid binding conflict

# Chat — Durable Objects (hosted in separate worker)
[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ChatRoom"
script_name = "chat-rooms-worker"

# Board Events — Durable Objects (hosted in separate worker)
[[durable_objects.bindings]]
name = "BOARD_ROOMS"
class_name = "BoardRoom"
script_name = "board-events-worker"

# Banner Rooms — Durable Objects for real-time banner collaboration
[[durable_objects.bindings]]
name = "BANNER_ROOMS"
class_name = "BannerRoom"
script_name = "banner-rooms-worker"

# Environment-specific variables are managed in the Cloudflare Pages dashboard
# (Settings > Variables and Secrets) for preview and production environments.
