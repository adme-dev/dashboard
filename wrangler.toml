name = "agency-dashboard"
pages_build_output_dir = "dist"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ============================================
# Cloudflare Bindings
# ============================================

# KV — edge caching for tokens, sessions, and report responses
# Create with: npx wrangler kv namespace create CACHE
# Then paste the ID below
[[kv_namespaces]]
binding = "CACHE"
id = "<your-kv-namespace-id>"

# Queues — reliable background job processing with retry and dead-letter
# Create with: npx wrangler queues create agency-jobs
[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "agency-jobs"

[[queues.consumers]]
queue = "agency-jobs"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "agency-jobs-dlq"

# AI — Workers AI for embeddings and edge inference
[ai]
binding = "AI"

# Vectorize — semantic search index for tasks, briefs, clients, knowledge
# Create with: npx wrangler vectorize create agency-search --dimensions=768 --metric=cosine
[[vectorize]]
binding = "VECTORIZE"
index_name = "agency-search"

# Hyperdrive — edge connection pooling for Neon Postgres
# Create with: npx wrangler hyperdrive create agency-db --connection-string="$DATABASE_URL"
# Then paste the ID below
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<your-hyperdrive-config-id>"

# ============================================
# Environment Variables (non-secret)
# ============================================
[vars]
APP_NAME = "XeroFlow Agency"
NODE_VERSION = "22"

# Chat — Durable Objects (hosted in separate worker)
[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ChatRoom"
script_name = "chat-rooms-worker"

# Board Events — Durable Objects (hosted in separate worker)
[[durable_objects.bindings]]
name = "BOARD_ROOMS"
class_name = "BoardRoom"
script_name = "board-events-worker"

# Preview/Staging environment
[env.preview]
name = "agency-dashboard-preview"
[env.preview.vars]
APP_URL = "https://preview.agency-dashboard.pages.dev"
EMAIL_FROM = "noreply@preview.agency-dashboard.pages.dev"
XERO_REDIRECT_URI = "https://preview.agency-dashboard.pages.dev/api/xero/callback"
NUXT_PUBLIC_ZERO_SERVER_URL = "https://zero-preview.agency-dashboard.pages.dev"

# Production environment
[env.production]
name = "agency-dashboard"
[env.production.vars]
APP_URL = "https://agency-dashboard.pages.dev"
EMAIL_FROM = "noreply@yourdomain.com"
XERO_REDIRECT_URI = "https://agency-dashboard.pages.dev/api/xero/callback"
NUXT_PUBLIC_ZERO_SERVER_URL = "https://zero.agency-dashboard.pages.dev"
